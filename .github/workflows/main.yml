name: Build Remote Control APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          unzip -o *.zip
          if [ -d "GlassRemoteV1.0-main" ]; then
            cp -r GlassRemoteV1.0-main/* .
            rm -rf GlassRemoteV1.0-main
          fi

      - name: Configure Gradle Environment
        run: |
          # Inject required AndroidX and Jetifier flags
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlassRemote-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          
