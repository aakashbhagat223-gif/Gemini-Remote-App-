name: Build Remote Control APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          # Find and extract the uploaded zip archive
          unzip -o *.zip
          
          # If the zip extracted into a subfolder, bring all files to the root
          if [ -d "GlassRemoteV1.0-main" ]; then
            cp -r GlassRemoteV1.0-main/* .
            rm -rf GlassRemoteV1.0-main
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlassRemote-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          
